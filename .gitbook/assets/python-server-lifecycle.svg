<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
<title id="title">Control a server simulation with Python</title><desc id="desc">The Python HTTP client registers a model, creates and starts its instance, writes a 31.25 degree input, sets explicit simulation times, runs each cycle and checks telemetry. It then stops and removes its own demo resources.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18343d}.title{font-size:32px;font-weight:700;letter-spacing:-.5px}.subtitle{font-size:20px;fill:#526972}.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.5px}.heading{font-size:24px;font-weight:700}.body{font-size:19px;fill:#435f69}.small{font-size:17px;fill:#526972}.code{font-family:Menlo,Consolas,monospace;font-size:18px}.teal{fill:#007f76}.blue{fill:#2459a6}.line{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 9 5 1 9Z" fill="#007f76"/></marker></defs>
<rect width="1200" height="530" rx="20" fill="#f5f8fa"/>
<text x="40" y="57" class="title" >Control a server simulation with Python</text><text x="40" y="92" class="subtitle" >spx-python sends HTTP requests; the model executes in SPX Server.</text><rect x="40" y="130" width="1120" height="320" rx="18" fill="#fff" stroke="#bdcdd4" stroke-width="1.5"/><text x="64" y="166" class="eyebrow" >SERVER WORKFLOW · DRIVEN BY THE PYTHON CLIENT</text><rect x="64" y="206" width="310" height="192" rx="14" fill="#e9f5f2" stroke="#c5d4db"/><text x="86" y="242" class="eyebrow" >STEP 1</text><text x="86" y="280" class="heading" >Create and prepare</text><text x="86" y="319" class="body" >Register docs_pt100.</text><text x="86" y="350" class="body" >Create and start docs_sensor.</text><path d="M374 300H445" class="line" stroke="#007f76" marker-end="url(#arrow)"/><rect x="445" y="206" width="310" height="192" rx="14" fill="#edf3fc" stroke="#c5d4db"/><text x="467" y="242" class="eyebrow" >STEP 2</text><text x="467" y="280" class="heading" >Set and run</text><text x="467" y="319" class="body" >Write the 31.25°C input.</text><text x="467" y="350" class="body" >Set time, then run one cycle.</text><path d="M755 300H826" class="line" stroke="#007f76" marker-end="url(#arrow)"/><rect x="826" y="206" width="310" height="192" rx="14" fill="#fff6e7" stroke="#c5d4db"/><text x="848" y="242" class="eyebrow" >STEP 3</text><text x="848" y="280" class="heading" >Read and clean up</text><text x="848" y="319" class="body" >Assert time and telemetry.</text><text x="848" y="350" class="body" >Stop and delete demo objects.</text><text x="64" y="491" class="body" >Manual clock: real_time=False. Verify each processed sample before cleanup.</text>
</svg>
