<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">Manual Python connection propagation</title><desc id="desc">Within SPX Server, docs_source processes its key input and exposes temperature_c. docs_temperature_link reads the source External telemetry and writes the target Internal k__temperature_c. Run the target next, then assert its telemetry. Repeat for 28 and 34 degrees Celsius.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18343d}.title{font-size:32px;font-weight:700;letter-spacing:-.5px}.subtitle{font-size:20px;fill:#526972}.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.5px}.heading{font-size:24px;font-weight:700}.body{font-size:19px;fill:#435f69}.small{font-size:17px;fill:#526972}.code{font-family:Menlo,Consolas,monospace;font-size:18px}.teal{fill:#007f76}.blue{fill:#2459a6}.line{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 9 5 1 9Z" fill="#007f76"/></marker></defs>
<rect width="1200" height="660" rx="20" fill="#f5f8fa"/>
<text x="40" y="57" class="title" >Source → connection → target</text><text x="40" y="92" class="subtitle" >Python controls the execution order; the connection copies one value.</text><rect x="40" y="130" width="1120" height="340" rx="18" fill="#fff" stroke="#bdcdd4" stroke-width="1.5"/><text x="64" y="166" class="eyebrow" >SPX SERVER · MANUAL STEPPING</text><rect x="64" y="195" width="302" height="235" rx="14" fill="#e9f5f2" stroke="#afcfc7"/><text x="86" y="229" class="eyebrow" >SOURCE INSTANCE</text><text x="86" y="267" class="heading" >docs_source</text><text x="86" y="308" class="code" >k__temperature_c</text><text x="86" y="339" class="small" >↓  model cycle</text><text x="86" y="373" class="code" >temperature_c</text><text x="86" y="406" class="body" >28°C, then 34°C</text><rect x="834" y="195" width="302" height="235" rx="14" fill="#edf3fc" stroke="#bed0eb"/><text x="856" y="229" class="eyebrow" >TARGET INSTANCE</text><text x="856" y="267" class="heading" >docs_target</text><text x="856" y="308" class="code" >k__temperature_c</text><text x="856" y="339" class="small" >↓  model cycle</text><text x="856" y="373" class="code" >temperature_c</text><text x="856" y="406" class="body" >28°C, then 34°C</text><rect x="464" y="252" width="272" height="135" rx="14" fill="#fff6e7" stroke="#e1c590"/><text x="486" y="286" class="eyebrow" >CONNECTION</text><text x="486" y="325" class="code" >docs_temperature_link</text><text x="486" y="360" class="body" >External → Internal</text><path d="M366 373H464" class="line" stroke="#007f76" marker-end="url(#arrow)"/><path d="M736 319H786V308H834" class="line" stroke="#007f76" marker-end="url(#arrow)"/><text x="64" y="513" class="eyebrow" >ONE TEST ITERATION</text><text x="64" y="550" class="heading" >1  Run the source</text><text x="64" y="583" class="body" >Process the new input.</text><text x="445" y="550" class="heading" >2  Run the connection</text><text x="445" y="583" class="body" >Copy source telemetry.</text><text x="834" y="550" class="heading" >3  Run the target</text><text x="834" y="583" class="body" >Process and assert telemetry.</text><text x="64" y="628" class="small" >Repeat with 34°C. Stop and remove the demo link, instances and model afterwards.</text>
</svg>
