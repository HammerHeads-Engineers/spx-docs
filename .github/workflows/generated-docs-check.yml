name: Documentation checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-tutorials.txt
      - name: Fetch pinned public examples
        run: python scripts/check_sources.py --checkout .tmp/spx-examples
      - name: Check generated catalog
        run: python scripts/generate_device_catalog.py --spx-examples .tmp/spx-examples --source-ref $(python -c 'import json; print(json.load(open("sources.json"))["catalog"]["commit"])') --check
      - name: Check Markdown navigation and model samples
        run: python scripts/check_docs.py
      - name: Check task navigation and legacy coverage
        run: python scripts/check_navigation.py
      - name: Check executable tutorial blocks
        run: python scripts/render_tutorials.py --check
      - name: Check generator failure and idempotence guards
        run: python -m unittest discover -s tests -v
